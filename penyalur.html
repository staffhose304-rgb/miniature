<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Struk Bank</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(270deg, #1f1f1f, #2b2b2b, #1f1f1f);
    background-size: 600% 600%;
    animation: bgMove 15s ease infinite;
    color: #e5e5e5;
    overflow-x: hidden;
}

/* animasi background */
@keyframes bgMove {
    0% {background-position: 0%}
    50% {background-position: 100%}
    100% {background-position: 0%}
}

/* canvas api tetap */
#fireCanvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
  opacity: 0.4;
}

/* HEADER */
.header {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
    margin: 15px;
    border-radius: 15px;

    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);

    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 5px 20px rgba(0,0,0,0.5);
    z-index: 2;
}

.title {
    font-size: 20px;
    font-weight: bold;
    background: linear-gradient(90deg, #ffffff, #aaaaaa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 2px;
}

/* BACK BUTTON */
#backBtn {
  padding: 8px 15px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: bold;
  background: #111;
  color: #00ffcc;
  border: none;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(0,255,200,0.5);
  transition: 0.3s;
}
#backBtn:hover {
  transform: scale(1.05);
}

/* WRAPPER */
.overlay {
  position: relative;
  z-index: 1;
  padding: 30px;
}

/* TITLE */
h1 {
  text-align: center;
  margin-bottom: 30px;
  letter-spacing: 2px;
}

/* MENU GRID */
.menu-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 25px;
}

/* CARD STYLE */
.menu-bar button {
    background: #ffffff;
    color: #111;
    border-radius: 15px;
    padding: 25px;
    text-align: center;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: 0.35s;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    border: none;
    font-size: 16px;
    font-weight: bold;
}

/* shine effect */
.menu-bar button::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.8),
        transparent
    );
    transform: skewX(-20deg);
}

.menu-bar button:hover::before {
    animation: shine 0.8s;
}

@keyframes shine {
    100% {
        left: 150%;
    }
}

/* hover effect */
.menu-bar button:hover {
    transform: translateY(-10px) scale(1.05);
    box-shadow: 0 15px 35px rgba(255,255,255,0.2);
}

/* klik effect */
.menu-bar button:active {
    transform: scale(0.95);
}

</style>
</head>

<body>

<canvas id="fireCanvas"></canvas>

<!-- HEADER -->
<div class="header">
    <div class="title">🏦 MENU STRUK BANK</div>
    <button id="backBtn" onclick="goBack()">⬅ BACK</button>
</div>

<div class="overlay">
  <h1>Pilih Bank</h1>

  <div class="menu-bar">
    <button onclick="goTo('bca.html')">BCA</button>
    <button onclick="goTo('bni.html')">BNI</button>
    <button onclick="goTo('bniwonder.html')">BNI WONDER</button>
    <button onclick="goTo('mandiri.html')">MANDIRI</button>
  </div>
</div>

<script>
function goTo(page){
  window.location.href = page;
}

function goBack(){
  window.location.href = "index.html";
}

/* ================== FIRE EFFECT (TIDAK DIUBAH) ================== */
const canvas = document.getElementById('fireCanvas');
const ctx = canvas.getContext('2d');
let width, height;

function resize(){
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

class FireParticle {
  constructor(){ this.reset(); }
  reset(){
    this.x = Math.random()*width;
    this.y = height + 10 + Math.random()*100;
    this.size = 10 + Math.random()*15;
    this.speedY = 1 + Math.random()*3;
    this.speedX = (Math.random()-0.5);
    this.life = 0;
    this.maxLife = 60 + Math.random()*40;
  }
  update(){
    this.x += this.speedX;
    this.y -= this.speedY;
    this.life++;
    if(this.life >= this.maxLife) this.reset();
  }
  draw(){
    const gradient = ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.size);
    gradient.addColorStop(0,'rgba(255,255,255,1)');
    gradient.addColorStop(0.3,'rgba(255,200,0,0.8)');
    gradient.addColorStop(0.6,'rgba(255,100,0,0.5)');
    gradient.addColorStop(1,'rgba(255,0,0,0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fill();
  }
}

const particles = [];
for(let i=0;i<120;i++){
  particles.push(new FireParticle());
}

function animate(){
  ctx.clearRect(0,0,width,height);
  particles.forEach(p=>{
    p.update();
    p.draw();
  });
  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
