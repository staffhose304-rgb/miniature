<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>CSV Deposit Matrix - Dual Box Input</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #1a1a1a, #050505);
    color: #e5e5e5;
}

.container {
    width: 95%;
    max-width: 1200px;
    margin: 60px auto;
    background: rgba(20,20,20,0.95);
    border-radius: 15px;
    padding: 70px 20px 25px;
    position: relative;
    border: 1px solid #2a2a2a;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    display: grid;
    grid-template-columns: 1.2fr 1fr 1fr;
    gap: 15px;
}

.top-btns { position: absolute; top: 15px; left: 20px; display:flex; gap:10px; }
.clock { position: absolute; top: 15px; right: 20px; font-size: 14px; font-weight: 700; padding: 8px 16px; border-radius: 8px; background: linear-gradient(145deg, #1a1a1a, #0d0d0d); border: 1px solid #333; color: #fff; }

.marquee {
    grid-column: span 3;
    background: linear-gradient(90deg, #0d0d0d, #1a1a1a, #0d0d0d);
    padding: 14px; border-radius: 10px; overflow: hidden; border: 1px solid #2a2a2a; position: relative; height: 20px;
}
.marquee span { position: absolute; white-space: nowrap; font-weight: 700; padding-left: 100%; animation: marqueeMove 12s linear infinite; }
@keyframes marqueeMove { 0% { transform: translateX(0%); } 100% { transform: translateX(-100%); } }

.box { background: rgba(15,15,15,0.9); padding: 15px; border-radius: 12px; border: 1px solid #2a2a2a; display: flex; flex-direction: column; gap: 10px; }

/* DUAL INPUT UI */
.input-sub-box { display: flex; flex-direction: column; gap: 5px; }
.input-sub-box label { font-size: 11px; font-weight: bold; color: #888; }

textarea {
    width: 100%;
    background: #0d0d0d;
    color: white;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    padding: 8px;
    font-family: monospace;
    box-sizing: border-box;
    resize: none;
}

/* Penyesuaian Tinggi */
#csvInput1, #csvInput2 { height: 115px; }
#csvInputManual { height: 260px; display: none; } /* Default sembunyi */
#userInput { height: 260px; }

button { padding: 10px 14px; background: linear-gradient(145deg, #1a1a1a, #0a0a0a); border: 1px solid #2a2a2a; border-radius: 10px; cursor: pointer; color: #e5e5e5; font-weight: 600; }
button:hover { background: #222; }

.result { white-space: pre-wrap; height: 300px; overflow-y: auto; background: #0d0d0d; padding: 10px; border-radius: 10px; border: 1px solid #2a2a2a; font-size: 13px; }

.menu-nav { grid-column: span 3; display:flex; justify-content:center; gap:10px; }
.menu-nav button.active { background:#333; }
</style>
</head>

<body>

<div class="container">
    <div class="top-btns">
        <button onclick="goBack()">⬅ Back</button>
        <button onclick="resetAll()">⟳ Refresh</button>
    </div>

    <div class="clock" id="clock"></div>

    <div class="menu-nav">
        <button id="btnCsv" onclick="setMode('csv')" class="active">📁 Dual File CSV</button>
        <button id="btnManual" onclick="setMode('manual')">⌨ Manual Input</button>
    </div>

    <div class="marquee">
        <span>● JADIKAN SETIAP KESALAHAN SEBAGAI PELUANG UNTUK BERKEMBANG ●</span>
    </div>

    <div class="box">
        <h3 id="inputTitle" style="margin:0">Input Data</h3>
        
        <div id="dualInputArea">
            <div class="input-sub-box">
                <label>FILE CSV 1</label>
                <input type="file" id="fileInput1" accept=".csv">
                <textarea id="csvInput1" placeholder="Data CSV 1..."></textarea>
            </div>
            <div class="input-sub-box" style="margin-top:10px;">
                <label>FILE CSV 2</label>
                <input type="file" id="fileInput2" accept=".csv">
                <textarea id="csvInput2" placeholder="Data CSV 2..."></textarea>
            </div>
        </div>

        <textarea id="csvInputManual" placeholder="MODE MANUAL INPUT (Paste dari Excel)&#10;&#10;Contoh:&#10;1  2026-04-15 13:32:25 Deposit (PGA)   userA   PGA 100000"></textarea>
    </div>

    <div class="box">
        <h3 style="margin:0">User ID</h3>
        <textarea id="userInput" placeholder="Masukkan list User ID..."></textarea>
        <button onclick="processData()" style="width:100%; background: #222;">Proses Data</button>
    </div>

    <div class="box">
        <h3 style="margin:0">Hasil</h3>
        <button onclick="copyResult()">Copy Hasil</button>
        <div id="output" class="result"></div>
    </div>
</div>

<script>
let mode = "csv";

/* CLOCK */
setInterval(() => { document.getElementById("clock").innerText = new Date().toLocaleString('id-ID'); }, 1000);

function goBack() { window.location.href = "index.html"; }

function resetAll() {
    document.getElementById("fileInput1").value = "";
    document.getElementById("fileInput2").value = "";
    document.getElementById("csvInput1").value = "";
    document.getElementById("csvInput2").value = "";
    document.getElementById("csvInputManual").value = "";
    document.getElementById("userInput").value = "";
    document.getElementById("output").innerText = "";
}

/* SWITCH MODE TANPA MERUBAH FUNGSI MANUAL */
function setMode(m) {
    mode = m;
    const dualArea = document.getElementById("dualInputArea");
    const manualArea = document.getElementById("csvInputManual");
    
    document.getElementById("btnCsv").classList.toggle("active", m === 'csv');
    document.getElementById("btnManual").classList.toggle("active", m === 'manual');

    if (m === "manual") {
        dualArea.style.display = "none";
        manualArea.style.display = "block";
    } else {
        dualArea.style.display = "block";
        manualArea.style.display = "none";
    }
}

/* FILE READERS */
document.getElementById("fileInput1").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (file) document.getElementById("csvInput1").value = await file.text();
});

document.getElementById("fileInput2").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (file) document.getElementById("csvInput2").value = await file.text();
});

function clean(v) { return (v || "").replace(/"/g,"").replace(/\u00A0/g,"").trim().toLowerCase(); }

/* PROCESS DATA DENGAN FORMAT TANGGAL GABUNG */
function processData() {
    let raw = "";
    if (mode === "manual") {
        raw = document.getElementById("csvInputManual").value;
    } else {
        raw = document.getElementById("csvInput1").value + "\n" + document.getElementById("csvInput2").value;
    }

    let users = document.getElementById("userInput").value.split("\n").map(clean).filter(Boolean);
    if (!raw.trim() || users.length === 0) {
        alert("Input data dan User ID wajib diisi!");
        return;
    }

    let rows = raw.split(/\r?\n/);
    let data = {}; 
    let globalDates = new Set(); // Menampung SEMUA tanggal unik yang ada di file

    // Tahap 1: Scan semua baris untuk mengumpulkan tanggal dan data deposit
    rows.forEach(row => {
        if (!row.trim()) return;
        row = row.replace(/"/g,"");

        let col;
        if (mode === "manual") {
            col = row.includes("\t") ? row.split("\t") : row.trim().split(/\s{2,}/);
        } else {
            col = row.split(",");
        }

        if (col.length < 5) return;

        let rawDate, info, user, coin;
        if (mode === "manual") {
            rawDate = clean(col[1]); info = clean(col[2]); user = clean(col[3]); coin = clean(col[5]);
        } else {
            rawDate = clean(col[0]); info = clean(col[1]); user = clean(col[2]); coin = clean(col[4]);
        }

        if (!rawDate || rawDate.includes("date") || rawDate.includes("total")) return;

        let date = rawDate.split(" ")[0];
        globalDates.add(date); // Catat tanggal ini ke daftar global

        let amount = parseInt(coin.replace(/[^0-9]/g,""));
        if (isNaN(amount)) return;

        // Simpan data deposit jika user ada dalam list
        if (users.includes(user)) {
            if (!(info === "deposit" || info === "deposit (pga)") || info.includes("reject")) return;

            if (!data[user]) {
                data[user] = {
                    amounts: []
                };
            }
            data[user].amounts.push(amount);
        }
    });

    // Tahap 2: Urutkan tanggal global untuk tampilan depan
    let sortedGlobalDates = Array.from(globalDates).sort();
    let globalDateString = sortedGlobalDates.map(d => `(${d})`).join("");

    let final = "";
    
    // Tahap 3: Susun hasil akhir
    users.forEach(user => {
        let amountString = "0";
        
        // Jika ada data deposit, gabungkan nominalnya
        if (data[user] && data[user].amounts.length > 0) {
            amountString = data[user].amounts
                .map(v => v.toLocaleString("id-ID"))
                .join(" - ");
        }

        // Tampilkan: (Tanggal Gabungan) | User => Nominal/0
        final += `${globalDateString} | ${user} => ${amountString}\n`;
    });

    document.getElementById("output").innerText = final || "Tidak ada data yang cocok.";
}

function copyResult() {
    navigator.clipboard.writeText(document.getElementById("output").innerText);
    alert("Copied!");
}
</script>

</body>
</html>
