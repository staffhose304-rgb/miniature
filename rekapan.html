<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Menu Rekapan</title>
<style>
/* ===== BODY & BACKGROUND ===== */
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(270deg, #1f1f1f, #2b2b2b, #1f1f1f);
    background-size: 600% 600%;
    animation: bgMove 15s ease infinite;
    color: #e5e5e5;
    overflow-x: hidden;
}

@keyframes bgMove {
    0% {background-position: 0%}
    50% {background-position: 100%}
    100% {background-position: 0%}
}

/* ===== HEADER ===== */
.header {
    width: 90%;
    max-width: 1000px;
    margin: 20px auto 10px auto;
    padding: 15px 20px;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    color: #fff;
    box-shadow: 0 5px 20px rgba(0,0,0,0.5);
}

/* ===== CONTAINER ===== */
.container {
    width: 90%;
    max-width: 1000px;
    margin: 20px auto 50px auto;
    background: rgba(0,0,0,0.65);
    padding: 25px;
    border-radius: 15px;
    box-sizing: border-box;
    position: relative;
    z-index: 2;
}

/* ===== BACK BUTTON ===== */
.back-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    padding: 10px 18px;
    background: orange;
    color: white;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 0 0 8px orange;
    z-index: 3;
    transition: 0.25s;
}
.back-btn:hover { background: darkorange; }

/* ===== TEXTAREA & BUTTON ===== */
textarea {
    width: 100%;
    height: 150px;
    font-family: monospace;
    font-size: 14px;
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 8px;
    border: none;
    background: #222;
    color: #fff;
    box-sizing: border-box;
}

button.action-btn {
    padding: 10px 18px;
    margin-right: 12px;
    background: orange;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    color: white;
    box-shadow: 0 0 8px orange;
    transition: 0.25s;
}
button.action-btn:hover { background: darkorange; }

/* ===== OUTPUT ===== */
#rekapanOutput {
    margin-top: 20px;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}
th, td {
    border: 1px solid #ccc;
    padding: 6px 10px;
    text-align: right;
}
th { background: #ff9900; color: black; }
th.sub { background: #ffd699; }
td.blue { color: #00ccff; font-weight: bold; }
td.red { color: #ff4444; font-weight: bold; }

/* ===== FIRE ANIMATION ===== */
.fire-container {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 300px;
    pointer-events: none;
    overflow: visible;
    z-index: 1;
}
.flame {
    position: absolute;
    bottom: 0;
    border-radius: 50%;
    opacity: 0.7;
    filter: blur(4px);
    animation-name: rise;
    animation-iteration-count: infinite;
    animation-timing-function: linear;
}
.spark {
    position: absolute;
    bottom: 0;
    width: 2px;
    height: 2px;
    background: yellow;
    border-radius: 50%;
    opacity: 0.8;
    animation-name: sparkRise;
    animation-iteration-count: infinite;
    animation-timing-function: linear;
}
@keyframes rise {
    0% { transform: translateY(0) scale(1); opacity: 0.7; }
    50% { transform: translateY(-80px) scale(1.2); opacity: 0.5; }
    100% { transform: translateY(-250px) scale(0.5); opacity: 0; }
}
@keyframes sparkRise {
    0% { transform: translateY(0) scale(1); opacity: 0.8; }
    100% { transform: translateY(-300px) scale(0.2); opacity: 0; }
}
</style>
</head>
<body>

<div class="header">📊 REKAPAN DATA LAPORAN</div>

<button class="back-btn" onclick="goBack()">Back</button>

<div class="container">
    <textarea id="rekapanInput" placeholder="Paste data laporan di sini, setiap kolom dipisah tab (TO, WL)"></textarea>
    <button class="action-btn" onclick="convertRekapan()">Convert</button>
    <button class="action-btn" onclick="copyRekapan()">Copy Nominal</button>
    <div id="rekapanOutput"></div>
</div>

<div class="fire-container" id="fireContainer"></div>

<script>
// ===== BACK BUTTON =====
function goBack(){ window.location.href="index.html"; }

// ===== FIRE ANIMATION =====
const fireContainer = document.getElementById('fireContainer');
for(let i=0;i<30;i++){
    const flame = document.createElement('div');
    flame.classList.add('flame');
    flame.style.left=Math.random()*100+'%';
    flame.style.width=10+Math.random()*20+'px';
    flame.style.height=20+Math.random()*50+'px';
    flame.style.background=`radial-gradient(circle, rgba(255,${100+Math.random()*155},0,1) 0%, rgba(255,0,0,0.5) 70%, transparent 100%)`;
    flame.style.animationDuration=(1+Math.random()*2)+'s';
    fireContainer.appendChild(flame);
}
for(let i=0;i<50;i++){
    const spark=document.createElement('div');
    spark.classList.add('spark');
    spark.style.left=Math.random()*100+'%';
    spark.style.animationDuration=(0.5+Math.random()*1.5)+'s';
    fireContainer.appendChild(spark);
}

// ===== REKAPAN FUNCTIONS =====
function parseNumber(val){
    if(!val) return 0;
    val = val.replace(/,/g,"").trim();
    if(val.startsWith("(") && val.endsWith(")")) return -parseFloat(val.replace(/[()]/g,""));
    return parseFloat(val) || 0;
}

function formatNumber(num){
    let sign = num < 0 ? "-" : "";
    let abs = Math.abs(num);
    return sign + abs.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function convertRekapan(){
    const text = document.getElementById("rekapanInput").value.trim();
    if(!text){ alert("Masukkan data terlebih dahulu!"); return; }

    const rows = text.split("\n");
    let data = {};
    rows.forEach(r=>{
        const col = r.split(/\t+/);
        const name = col[0]?.toLowerCase();
        const turnover = parseNumber(col[1]);
        const wl = parseNumber(col[3]);
        if(name) data[name] = { to: turnover, wl: wl };
    });

    const mapping = {
        "TOGEL": "toto",
        "TOTOMACAU 4D": "totomacau 4d",
        "TOTOMACAU 5D": "totomacau 5d",
        "PRAGMATIC PLAY": "pragmatic play",
        "E-LOTTERY": "elottery",
        "ARCADE": "arcade",
        "POKER": "poker",
        "TOTALAN LIVEGAMES": "live game",
        "SLOT": "slot"
    };

    let html = "<table><tr>";
    for(let key in mapping) html += `<th colspan='2'>${key}</th>`;
    html += "</tr><tr>";
    for(let key in mapping) html += "<th class='sub'>TO</th><th class='sub'>WL</th>";
    html += "</tr><tr>";
    for(let key in mapping){
        const g = data[mapping[key]];
        if(!g){ html+="<td></td><td></td>"; }
        else{
            const wlFlipped = g.wl * -1;
            html += `<td class='blue'>${formatNumber(g.to)}</td>`;
            html += `<td class='red'>${formatNumber(wlFlipped)}</td>`;
        }
    }
    html += "</tr></table>";
    document.getElementById("rekapanOutput").innerHTML = html;
}

function copyRekapan(){
    const output = document.getElementById("rekapanOutput");
    const cells = output.querySelectorAll("td");
    if(!cells.length){ alert("Tidak ada data untuk dicopy!"); return; }
    const result = Array.from(cells).map(c => c.innerText);
    navigator.clipboard.writeText(result.join("\t"))
        .then(()=>alert("Nominal berhasil dicopy!"))
        .catch(()=>alert("Gagal menyalin data."));
}
</script>
</body>
</html>
