<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Menu Rekapan</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #1a1a1a, #050505);
    color: #e5e5e5;
}

/* CONTAINER */
.container {
    width: 90%;
    max-width: 1000px;
    margin: 60px auto;
    background: rgba(20,20,20,0.95);
    border-radius: 15px;
    padding: 60px 20px 25px;
    position: relative;
    border: 1px solid #2a2a2a;
    box-shadow: 
        0 10px 30px rgba(0,0,0,0.8),
        inset 0 0 20px rgba(255,255,255,0.03);
}

/* CLOCK */
.clock {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 14px;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 8px;
    background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
    border: 1px solid #333;
    color: #fff;
}

/* MARQUEE */
.marquee {
    background: linear-gradient(90deg, #0d0d0d, #1a1a1a, #0d0d0d);
    padding: 14px;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 25px;
    border: 1px solid #2a2a2a;
}
.marquee span {
    display: inline-block;
    white-space: nowrap;
    font-weight: 700;
    animation: jalan 12s linear infinite;
}
@keyframes jalan {
    from { transform: translateX(100%); }
    to { transform: translateX(-100%); }
}

/* BACK BUTTON */
.back-btn {
    position: absolute;
    top: 15px;
    left: 20px;
    padding: 8px 16px;
    background: #1a1a1a;
    border: 1px solid #333;
    color: #fff;
    border-radius: 8px;
    cursor: pointer;
}

/* TEXTAREA */
textarea {
    width: 100%;
    height: 150px;
    background: #0d0d0d;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    color: #fff;
    padding: 12px;
    margin-bottom: 15px;
    font-family: monospace;
}

/* BUTTON STYLE */
.action-btn {
    padding: 12px 20px;
    border-radius: 10px;
    border: 1px solid #2a2a2a;
    background: linear-gradient(145deg, #1a1a1a, #0a0a0a);
    color: #e5e5e5;
    cursor: pointer;
    font-weight: 600;
    margin-right: 10px;
    transition: 0.3s;
}
.action-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 10px rgba(255,255,255,0.1);
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}
th, td {
    border: 1px solid #2a2a2a;
    padding: 8px;
    text-align: right;
}
th {
    background: #111;
    color: #fff;
}
th.sub {
    background: #1a1a1a;
}
td.blue { color: #00ccff; font-weight: bold; }
td.red { color: #ff4444; font-weight: bold; }

</style>
</head>

<body>

<div class="container">

    <button class="back-btn" onclick="goBack()">← Back</button>

    <div class="clock" id="clock"></div>

    <div class="marquee">
        <span>● CAPEK ITU WAJAR-MENYERAH ITU PILIHAN  "," NGGAK HARUS SEMPURNA-YANG PENTING TERUS BERJALAN ●</span>
    </div>

    <textarea id="rekapanInput" placeholder="Paste data laporan di sini..."></textarea>

    <button class="action-btn" onclick="convertRekapan()">Convert</button>
    <button class="action-btn" onclick="copyRekapan()">Copy Nominal</button>

    <div id="rekapanOutput"></div>

</div>

<script>
// CLOCK
function updateClock() {
    const now = new Date();
    const hari = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
    const bulan = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

    let h = hari[now.getDay()];
    let tgl = now.getDate();
    let b = bulan[now.getMonth()];
    let th = now.getFullYear();

    let jam = String(now.getHours()).padStart(2, '0');
    let menit = String(now.getMinutes()).padStart(2, '0');
    let detik = String(now.getSeconds()).padStart(2, '0');

    document.getElementById("clock").innerHTML =
        `${h}, ${tgl} ${b} ${th} | ${jam}:${menit}:${detik}`;
}
setInterval(updateClock, 1000);
updateClock();

// BACK
function goBack(){ window.location.href="index.html"; }

// ===== ORIGINAL FUNCTIONS (TIDAK DIUBAH) =====
function parseNumber(val){
    if(!val) return 0;
    val = val.replace(/,/g,"").trim();
    if(val.startsWith("(") && val.endsWith(")")) return -parseFloat(val.replace(/[()]/g,""));
    return parseFloat(val) || 0;
}

function formatNumber(num){
    let sign = num < 0 ? "-" : "";
    let abs = Math.abs(num);
    return sign + abs.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function convertRekapan(){
    const text = document.getElementById("rekapanInput").value.trim();
    if(!text){ alert("Masukkan data terlebih dahulu!"); return; }

    const rows = text.split("\n");
    let data = {};
    rows.forEach(r=>{
        const col = r.split(/\t+/);
        const name = col[0]?.toLowerCase();
        const turnover = parseNumber(col[1]);
        const wl = parseNumber(col[3]);
        if(name) data[name] = { to: turnover, wl: wl };
    });

    const mapping = {
        "TOGEL": "toto",
        "TOTOMACAU 4D": "totomacau 4d",
        "TOTOMACAU 5D": "totomacau 5d",
        "PRAGMATIC PLAY": "pragmatic play",
        "E-LOTTERY": "elottery",
        "ARCADE": "arcade",
        "POKER": "poker",
        "TOTALAN LIVEGAMES": "live game",
        "SLOT": "slot"
    };

    let html = "<table><tr>";
    for(let key in mapping) html += `<th colspan='2'>${key}</th>`;
    html += "</tr><tr>";
    for(let key in mapping) html += "<th class='sub'>TO</th><th class='sub'>WL</th>";
    html += "</tr><tr>";
    for(let key in mapping){
        const g = data[mapping[key]];
        if(!g){ html+="<td></td><td></td>"; }
        else{
            const wlFlipped = g.wl * -1;
            html += `<td class='blue'>${formatNumber(g.to)}</td>`;
            html += `<td class='red'>${formatNumber(wlFlipped)}</td>`;
        }
    }
    html += "</tr></table>";
    document.getElementById("rekapanOutput").innerHTML = html;
}

function copyRekapan(){
    const output = document.getElementById("rekapanOutput");
    const cells = output.querySelectorAll("td");
    if(!cells.length){ alert("Tidak ada data untuk dicopy!"); return; }
    const result = Array.from(cells).map(c => c.innerText);
    navigator.clipboard.writeText(result.join("\t"))
        .then(()=>alert("Nominal berhasil dicopy!"))
        .catch(()=>alert("Gagal menyalin data."));
}
</script>

</body>
</html>
