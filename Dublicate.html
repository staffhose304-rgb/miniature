<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cek Sinkron Data Pemain</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #1a1a1a, #050505);
    color: #e5e5e5;
}

/* CONTAINER */
.container {
    width: 90%;
    max-width: 1000px;
    margin: 60px auto;
    background: rgba(20,20,20,0.95);
    border-radius: 15px;
    padding: 70px 20px 25px;
    position: relative;
    border: 1px solid #2a2a2a;
    box-shadow: 
        0 10px 30px rgba(0,0,0,0.8),
        inset 0 0 20px rgba(255,255,255,0.03);
}

/* CLOCK */
.clock {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 14px;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 8px;
    background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
    border: 1px solid #333;
    color: #fff;
}

/* BACK BUTTON */
.top-btns {
    position: absolute;
    top: 15px;
    left: 20px;
}
.top-btns button {
    margin-right: 8px;
}

/* MARQUEE */
.marquee {
    background: linear-gradient(90deg, #0d0d0d, #1a1a1a, #0d0d0d);
    padding: 14px;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 25px;
    border: 1px solid #2a2a2a;
}
.marquee span {
    display: inline-block;
    white-space: nowrap;
    font-weight: 700;
    animation: jalan 12s linear infinite;
}
@keyframes jalan {
    from { transform: translateX(100%); }
    to { transform: translateX(-100%); }
}

/* TEXT */
h2 {
    text-align: center;
    margin-bottom: 20px;
}
h3 {
    margin-top: 25px;
}

/* TEXTAREA */
textarea {
    width: 100%;
    height: 140px;
    background: #0d0d0d;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    color: #fff;
    padding: 12px;
    font-family: monospace;
}

/* BUTTON */
button {
    padding: 12px 20px;
    border-radius: 10px;
    border: 1px solid #2a2a2a;
    background: linear-gradient(145deg, #1a1a1a, #0a0a0a);
    color: #e5e5e5;
    cursor: pointer;
    font-weight: 600;
    transition: 0.3s;
}
button:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 10px rgba(255,255,255,0.1);
}

/* TABLE */
table {
    width: 100%;
    margin-top: 20px;
    border-collapse: collapse;
}
th, td {
    border: 1px solid #2a2a2a;
    padding: 8px;
}
th {
    background: #111;
}
td.tidak1 { color: #ff4444; font-weight: bold; }
td.tidak2 { color: #ffd700; font-weight: bold; }

/* INFO */
.info {
    margin-top: 20px;
    padding: 12px;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    text-align: center;
    font-weight: bold;
}

/* FIRE CANVAS */
#fireCanvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 0;
    pointer-events: none;
}
</style>
</head>

<body>

<canvas id="fireCanvas"></canvas>

<div class="container">

    <div class="top-btns">
        <button onclick="goBack()">← Back</button>
        <button onclick="resetAll()">⟳ Refresh</button>
    </div>

    <div class="clock" id="clock"></div>

    <div class="marquee">
        <span>● CEK SINKRON DATA ● VALIDASI PEMAIN ● PASTIKAN DATA SESUAI ●</span>
    </div>

    <h2>Cek Sinkron Data Pemain</h2>

    <h3>Data 1 (Data dari BK)</h3>
    <textarea id="data1"></textarea>

    <h3>Data 2 (Data dari doc bonus)</h3>
    <textarea id="data2"></textarea>

    <button onclick="cekData()">PROSES</button>

    <h3>Hasil Perbandingan:</h3>
    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>Nama Pemain</th>
                <th>Keterangan</th>
            </tr>
        </thead>
        <tbody id="hasil"></tbody>
    </table>

    <div id="infoBox"></div>

</div>

<script>
// CLOCK
function updateClock() {
    const now = new Date();
    const hari = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
    const bulan = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

    let h = hari[now.getDay()];
    let tgl = now.getDate();
    let b = bulan[now.getMonth()];
    let th = now.getFullYear();

    let jam = String(now.getHours()).padStart(2, '0');
    let menit = String(now.getMinutes()).padStart(2, '0');
    let detik = String(now.getSeconds()).padStart(2, '0');

    document.getElementById("clock").innerHTML =
        `${h}, ${tgl} ${b} ${th} | ${jam}:${menit}:${detik}`;
}
setInterval(updateClock, 1000);
updateClock();

// ===== ORIGINAL LOGIC (TIDAK DIUBAH) =====
function cekData() {
  const raw1 = document.getElementById("data1").value.trim();
  const raw2 = document.getElementById("data2").value.trim();

  const lines1 = raw1.split("\n");
  const lines2 = raw2.split("\n");

  let data1Set = new Set();

  lines1.forEach((line, index) => {
    if (index === 0) return;
    let cols = line.split("\t");
    if (cols.length > 1) {
      let nama = cols[1].trim().toLowerCase();
      if (nama) data1Set.add(nama);
    }
  });

  let data2Set = new Set(
    lines2.map(x => x.trim().toLowerCase()).filter(x => x !== "")
  );

  let tidakDiData2 = [];
  let tidakDiData1 = [];

  data1Set.forEach(nama => {
    if (!data2Set.has(nama)) {
      tidakDiData2.push(nama);
    }
  });

  data2Set.forEach(nama => {
    if (!data1Set.has(nama)) {
      tidakDiData1.push(nama);
    }
  });

  const tbody = document.getElementById("hasil");
  const infoBox = document.getElementById("infoBox");

  tbody.innerHTML = "";
  infoBox.innerHTML = "";

  let no = 1;

  if (tidakDiData2.length === 0 && tidakDiData1.length === 0) {
    infoBox.innerHTML = `<div class="info">✅ Semua data sudah sinkron</div>`;
    return;
  }

  tidakDiData2.forEach(nama => {
    tbody.innerHTML += `
      <tr>
        <td>${no++}</td>
        <td class="tidak2">${nama}</td>
        <td>Tidak ada di Data 2</td>
      </tr>
    `;
  });

  tidakDiData1.forEach(nama => {
    tbody.innerHTML += `
      <tr>
        <td>${no++}</td>
        <td class="tidak1">${nama}</td>
        <td>Tidak ada di Data 1</td>
      </tr>
    `;
  });
}

function goBack() {
  window.location.href = "index.html";
}

function resetAll() {
  document.getElementById("data1").value = "";
  document.getElementById("data2").value = "";
  document.getElementById("hasil").innerHTML = "";
  document.getElementById("infoBox").innerHTML = "";
}

// FIRE EFFECT (TETAP)
const canvas = document.getElementById('fireCanvas');
const ctx = canvas.getContext('2d');

let w, h;
function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

class FireParticle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * w;
    this.y = h + Math.random() * 50;
    this.size = 8 + Math.random() * 20;
    this.speedY = 1 + Math.random() * 3;
    this.speedX = (Math.random()-0.5)*1.5;
    this.life = 0;
    this.maxLife = 80 + Math.random()*40;
    this.opacity = 1;
  }
  update() {
    this.x += this.speedX + Math.sin(this.life*0.1)*0.5;
    this.y -= this.speedY;
    this.life++;
    this.opacity = 1 - this.life/this.maxLife;
    this.size *= 0.98;
    if(this.life >= this.maxLife || this.size <1) this.reset();
  }
  draw() {
    const gradient = ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.size);
    gradient.addColorStop(0, `rgba(255,255,200,${this.opacity})`);
    gradient.addColorStop(0.3, `rgba(255,200,0,${this.opacity})`);
    gradient.addColorStop(0.6, `rgba(255,100,0,${this.opacity*0.8})`);
    gradient.addColorStop(1, `rgba(255,0,0,0)`);
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fill();
  }
}

const particles = [];
for(let i=0;i<160;i++) particles.push(new FireParticle());
function animate() {
  ctx.clearRect(0,0,w,h);
  particles.forEach(p=>{p.update(); p.draw();});
  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
